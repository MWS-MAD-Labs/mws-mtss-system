<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <!-- Bare root paths, not %BASE_URL%... - Vite's dev/build pipeline
    already base-prefixes every absolute src/href/content reference it finds
    in this document on its own (same as the <script> tag below); adding
    %BASE_URL% manually here double-prefixes to /mtss/mtss/... instead. -->
    <link rel="icon" type="image/svg+xml" href="/mws-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MWS IntegraLearn" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#1e40af" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="mws-build-id" content="%VITE_BUILD_ID%" />

    <!-- PWA Links - manifest.webmanifest is VitePWA's generated file (scope/
    start_url/icons already base-aware, see vite.config.js); manifest.json
    was a stale hand-authored duplicate predating the /mtss prefix, always
    unprefixed, now removed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/Millennia.webp" />

    <!-- Preconnects and Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <title>MWS IntegraLearn</title>
    <!-- Bare root path, not %BASE_URL%env.js - Vite's dev/build pipeline
    already base-prefixes <script src> references on its own; combining that
    with a manual %BASE_URL% here doubled up into /mtss/mtss/env.js. -->
    <script src="/env.js"></script>
</head>

<body>
    <!-- Force-update stale service workers on version bump -->
    <script>
        (function () {
            var SW_VERSION = '%VITE_BUILD_ID%';
            if (localStorage.getItem('sw_version') !== SW_VERSION && 'serviceWorker' in navigator) {
                localStorage.setItem('sw_version', SW_VERSION);
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    var promises = regs.map(function (r) { return r.unregister(); });
                    return Promise.all(promises);
                }).then(function () {
                    return caches.keys();
                }).then(function (names) {
                    return Promise.all(names.map(function (n) { return caches.delete(n); }));
                }).then(function () {
                    location.reload();
                });
            }
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
