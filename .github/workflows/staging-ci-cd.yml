name: MTSS System — Staging CI/CD

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  BE_IMAGE: ${{ github.repository_owner }}/mws-mtss-system-be
  FE_IMAGE: ${{ github.repository_owner }}/mws-mtss-system-fe

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────
  # BACKEND: Quality Gate
  # ─────────────────────────────────────────
  test-be:
    name: BE Quality Gate
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install BE deps
        run: npm ci
        working-directory: backend

      - name: Lint BE (advisory)
        continue-on-error: true
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint, skipping."; fi
        working-directory: backend

      - name: Unit tests BE
        run: |
          if npm run | grep -q "test:smoke"; then
            npm run test:smoke -- --testTimeout=60000
          elif npm run | grep -q " test"; then
            npm test -- --ci
          else
            echo "No test script, skipping."
          fi
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          MONGODB_URI: mongodb://localhost:27017/mws-mtss-system-test
          SLACK_BOT_TOKEN: ""
          SLACK_APP_TOKEN: ""
          GOOGLE_CLIENT_ID: dummy-client-id-for-ci
          GOOGLE_CLIENT_SECRET: dummy-client-secret-for-ci
          GOOGLE_REDIRECT_URL: http://localhost:3004/auth/google/callback
          GOOGLE_AI_API_KEY: dummy-api-key-for-ci
          AGENT_ROUTER_TOKEN: dummy-agent-router-token-for-ci

  # ─────────────────────────────────────────
  # FRONTEND: Quality Gate
  # ─────────────────────────────────────────
  test-fe:
    name: FE Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install FE deps
        run: npm ci
        working-directory: frontend

      - name: Lint FE (advisory)
        continue-on-error: true
        run: |
          if npm run | grep -q " lint"; then npm run lint -- --quiet; else echo "No lint, skipping."; fi
        working-directory: frontend

      # Build is the hard gate — it catches real runtime/import breakage.
      - name: Build FE
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: /mtss/api/v1
          VITE_BASE_PATH: /mtss/

  # ─────────────────────────────────────────
  # BUILD & PUSH — Backend Image
  # ─────────────────────────────────────────
  build-be:
    name: Build & Push BE Image
    runs-on: ubuntu-latest
    needs: [test-be]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — BE
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BE_IMAGE }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}

      - name: Build and push BE
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mtss-system-be
          cache-to: type=gha,mode=max,scope=mtss-system-be
          platforms: linux/amd64
          build-args: |
            BUILD_ID=${{ github.sha }}

      - name: Summary BE
        run: |
          echo "## 🐳 MTSS System — Backend Image" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # BUILD & PUSH — Frontend Image
  # ─────────────────────────────────────────
  build-fe:
    name: Build & Push FE Image
    runs-on: ubuntu-latest
    needs: [test-fe]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — FE
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FE_IMAGE }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}

      - name: Build and push FE
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mtss-system-fe
          cache-to: type=gha,mode=max,scope=mtss-system-fe
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE=/mtss/api/v1
            VITE_BASE_PATH=/mtss/
            VITE_BUILD_ID=${{ github.sha }}

      - name: Summary FE
        run: |
          echo "## 🐳 MTSS System — Frontend Image" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY

  # The permission list of this version has to reach Central before the new containers replace the old ones.
  # The token and the address come from the repository secrets with the name of the environment in front.
  sync-permissions:
    name: Send Permission List To Central
    runs-on: ubuntu-latest
    needs: [test-be]
    if: github.ref == 'refs/heads/staging'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install BE deps
        run: npm ci
        working-directory: backend

      - name: Send permissions
        env:
          CENTRAL_API_BASE_URL: ${{ secrets.STAGING_CENTRAL_API_BASE_URL || vars.CENTRAL_API_BASE_URL || secrets.CENTRAL_API_BASE_URL }}
          CENTRAL_API_TOKEN: ${{ secrets.STAGING_CENTRAL_API_TOKEN || secrets.CENTRAL_API_TOKEN }}
          CENTRAL_ORGANIZATION_ID: ${{ secrets.STAGING_CENTRAL_ORGANIZATION_ID || vars.CENTRAL_ORGANIZATION_ID }}
        run: |
          if [ -z "$CENTRAL_API_BASE_URL" ] || [ -z "$CENTRAL_API_TOKEN" ]; then
            echo "::error::CENTRAL_API_BASE_URL and CENTRAL_API_TOKEN are not set. Add STAGING_CENTRAL_API_BASE_URL and STAGING_CENTRAL_API_TOKEN as repository secrets."
            exit 1
          fi
          # The address is hidden in the log, so say what is wrong with its shape instead of showing it.
          case "${CENTRAL_API_BASE_URL%/}" in
            https://*/api/internal) ;;
            *)
              echo "::error::STAGING_CENTRAL_API_BASE_URL must start with https:// and end with /api/internal, for example https://db-stg.example.org/api/internal."
              exit 1
              ;;
          esac
          npm run permissions:sync -- --retries 5 --wait 20
        working-directory: backend

  # ─────────────────────────────────────────
  # DEPLOY — Trigger Komodo Stack Redeploy
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Komodo (Staging)
    runs-on: ubuntu-latest
    needs: [build-be, build-fe, sync-permissions]
    if: |
      always() &&
      needs.sync-permissions.result == 'success' &&
      needs.build-be.result == 'success' &&
      needs.build-fe.result == 'success'
    steps:
      - name: Trigger Komodo — mws-mtss-system stack
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL_STAGING || secrets.KOMODO_STAGING_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET_STAGING || secrets.KOMODO_STAGING_WEBHOOK_SECRET || secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo "Missing staging Komodo webhook secrets."
            echo "Set KOMODO_WEBHOOK_URL_STAGING (the webhook of the staging stack in Komodo) and KOMODO_WEBHOOK_SECRET_STAGING. The secret may also be the shared KOMODO_WEBHOOK_SECRET."
            exit 1
          fi

          BODY='{"ref":"refs/heads/staging","repository":{"name":"mws-mtss-system"},"tag":"staging","environment":"staging"}'
          SIGNATURE=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | awk '{print "sha256="$2}')
          HTTP_STATUS=$(curl -s -o /tmp/komodo_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY" \
            "$KOMODO_WEBHOOK_URL")
          echo "Komodo response [HTTP $HTTP_STATUS]:"
          cat /tmp/komodo_resp.txt
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ] || exit 1

      # The webhook only starts the deploy. This waits until the address reports the commit that was just built, so a
      # deploy that failed in Komodo shows here too. Without an address it only warns.
      - name: Wait for the new version
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL || vars.STAGING_HEALTH_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::STAGING_HEALTH_URL is not set, so this deploy was not checked. Add it as a repository secret or variable."
            exit 0
          fi
          ATTEMPTS="${WAIT_ATTEMPTS:-36}"
          PAUSE="${WAIT_PAUSE:-10}"
          for i in $(seq 1 "$ATTEMPTS"); do
            BODY="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq "\"buildId\":\"$EXPECTED_VERSION\""; then
              echo "The new version is running."
              exit 0
            fi
            echo "Attempt $i of $ATTEMPTS: not the new version yet."
            sleep "$PAUSE"
          done
          echo "::error::The new version did not come up. Open the stack in Komodo and read its last update."
          exit 1

      - name: Deployment summary
        run: |
          echo "## 🚀 MTSS System Deployed to Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **BE image:** \`ghcr.io/${{ env.BE_IMAGE }}:staging-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **FE image:** \`ghcr.io/${{ env.FE_IMAGE }}:staging-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Komodo stack:** \`mws-mtss-system\`" >> $GITHUB_STEP_SUMMARY
