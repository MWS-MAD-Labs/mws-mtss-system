# mws-mtss-system staging - Komodo manual compose
# Image-based, no build step. The staging gateway reaches this stack through the external mws-unified network, by the
# name mtss-system-fe (see the gateway's nginx: set $mtss_fe mtss-system-fe). Without that name on that network the
# gateway answers 502 for everything under /mtss/.

services:
  backend:
    image: ghcr.io/mws-mad-labs/mws-mtss-system-be:staging
    container_name: mtss-system-be-stg
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3004
    expose:
      - "3004"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/mws-mad-labs/mws-mtss-system-fe:staging
    container_name: mtss-system-fe
    restart: unless-stopped
    environment:
      HUB_BASE_URL: https://app-stg.mws.web.id
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - mws-unified
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified:
    external: true
    name: mws-unified
